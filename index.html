<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin Henriquez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#111; --paper:#fff; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--paper); color:var(--ink); font-family:'Archivo', sans-serif; font-weight:500; font-style:italic; overflow-x:hidden; }

  /* ultra-minimal fixed marks, hidden until scroll begins */
  .mark, .contact{
    position:fixed; top:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.08em;
    z-index:50; mix-blend-mode:difference; color:#fff;
    opacity:0;
    transition:opacity 0.8s ease;
  }
  .mark{ left:28px; }
  .contact{ right:28px; }
  .mark.show, .contact.show{ opacity:1; }
  .contact a{ color:inherit; text-decoration:none; }
  .contact a:hover{ text-decoration:underline; }

  /* opening: full-bleed, silent, no overlay at all */
  .opening{
    width:100vw; height:100vh; position:relative; overflow:hidden;
  }
  .opening img{
    width:100%; height:100%; object-fit:cover; object-position:center top; display:block;
    transform:scale(1.06);
    animation:openReveal 2.6s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes openReveal{
    from{ transform:scale(1.06); filter:brightness(0.85); }
    to{ transform:scale(1); filter:brightness(1); }
  }
  .scroll-cue{
    position:absolute; bottom:32px; left:50%; transform:translateX(-50%);
    width:1px; height:36px; background:rgba(255,255,255,0.7);
    animation:cuePulse 2s ease-in-out infinite;
  }
  @keyframes cuePulse{
    0%,100%{ opacity:0.2; }
    50%{ opacity:0.9; }
  }

  .frame{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
  }
  .frame img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1);
    filter:blur(0);
    opacity:1;
}
  .frame.visible img{
    transform:scale(1);
    filter:blur(0);
    opacity:1;
  }

  .end{
    min-height:70vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:0 8vw;
  }
  .end h2{
    font-weight:500;
    font-size:clamp(24px, 3.4vw, 40px);
    letter-spacing:-0.01em;
    max-width:600px;
    line-height:1.3;
  }
  .end .email{
    margin-top:26px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
    padding-bottom:2px;
  }

  @media (prefers-reduced-motion: reduce){
    .frame img, .opening img{ transition:opacity 0.4s ease; transform:none; filter:none; animation:none; }
    .scroll-cue{ animation:none; }
  }
</style>
</head>
<body>

<div class="mark" id="mark">Kevin Henriquez</div>
<div class="contact" id="contact"><a href="agency.html">↳</a></div>

<div class="opening">
  <img src="photos/bythelake.jpg" alt="">
  <div class="scroll-cue"></div>
</div>

<div class="frame"><img src="photos/dvd2.JPG" alt="" style="object-fit: contain;" >
</div>
<div class="frame"><img src="photos/ractwin.jpg" alt="" style="object-fit: contain;">
</div>
<div class="frame"><img src="photos/dj.jpg" alt="" style="object-fit: contain;">
</div>
<div class="frame"><img src="photos/urs.JPG" alt="" style="object-fit: contain;">
</div>
<div class="frame"><img src="photos/anyatest4.jpg" alt="" style="object-fit: contain;">
</div>
<div class="frame"><img src="photos/universo.jpg" alt="">
</div>
<div class="frame"><img src="photos/anyatest.JPG" alt="">
</div>

<div class="end">
  <h2></h2>
  <a class="Email" href="mailto:khenriquez.photo@gmail.com">Email</a>
  <span style="margin:0 8px;">·</span>
  <a class="email" href="https://www.instagram.com/kvnhjpg" target="_blank">Instagram</a>
  <span style="margin:0 8px;">·</span>
  <a class="email" href="agency.html">Portfolio</a>
</div>

<script>
  const frames = document.querySelectorAll('.frame');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.35 });
  frames.forEach(f => observer.observe(f));

  // reveal mark + contact only once the person starts scrolling
  const mark = document.getElementById('mark');
  const contact = document.getElementById('contact');
  let revealed = false;
  window.addEventListener('scroll', () => {
    if (!revealed && window.scrollY > 40) {
      mark.classList.add('show');
      contact.classList.add('show');
      revealed = true;
    }
  });
</script>

</body>
</html>
