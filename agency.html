<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kevin Henriquez — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#111; --paper:#fff; --line:#E4E2DC; --grey:#767469; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--paper); color:var(--ink); font-family:'Archivo', sans-serif; }

  /* everything visible immediately, no animation gating */
  header{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:20px;
    padding:36px 4vw 28px; border-bottom:1px solid var(--line);
  }
  .id h1{
    font-family:'Archivo Black', sans-serif; font-size:16px; letter-spacing:0.01em;
  }
  .id .role{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--grey); margin-top:6px;
  }
  .meta{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--grey);
    text-align:right; line-height:1.9;
  }
  .meta a{ color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); }
  .meta a:hover{ border-color:var(--ink); }
  .stats{
    display:flex; gap:28px; flex-wrap:wrap;
    padding:22px 4vw; border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--grey);
  }
  .stats b{ color:var(--ink); font-weight:600; }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:2px;
    background:var(--line);
    border-bottom:1px solid var(--line);
  }
  .cell{ background:var(--paper); }
  .cell img{
    width:100%; aspect-ratio:4/5; object-fit:cover; display:block;
  }
  .cell .cap{
    padding:8px 10px 12px;
    font-family:'IBM Plex Mono', monospace; font-size:10px; color:var(--grey);
    display:flex; justify-content:space-between;
  }
  .cell .cap b{ color:var(--ink); font-weight:500; }

  footer{
    padding:30px 4vw 50px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px;
    font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--grey);
  }
  footer a{ color:var(--grey); text-decoration:none; }
  footer a:hover{ color:var(--ink); }

  @media (max-width:820px){
    .grid{ grid-template-columns:repeat(2, 1fr); }
    header{ padding:28px 6vw 22px; }
    .meta{ text-align:left; }
  }
</style>
</head>
<body>
<header>
  <div class="id"><h1>Kevin Henriquez</h1></div>
  <div class="meta">
    <a href="mailto:khenriquez.photo@gmail.com">khenriquez.photo@gmail.com</a> <span>·</span> TFP available
  </div>
</header>

<div class="stats">
  <div><b>Available for:</b>TFP</div>
</div>

<div class="grid">
  <div class="cell">
    <img src="photos/brookeport.jpg" alt="" style="object-fit: cover;">
    <div class="cap"><b>Portrait</b><span>2026</span></div>
  </div>
  <div class="cell">
    <img src="photos/racbw.jpg" alt="">
    <div class="cap"><b>Portrait</b><span>2026</span></div>
  </div>
  <div class="cell">
    <img src="photos/bbykiwi.jpg" alt="">

  </div>
  <div class="cell">
    <img src="photos/anyatest4.jpg" alt="">
    <div class="cap"><b>Editorial</b><span>2026</span></div>
  </div>
  <div class="cell">
    <img src="photos/urs.JPG" alt="">
    <div class="cap"><b>Street</b><span>2026</span></div>
  </div>
  <div class="cell">
    <img src="photos/universo.jpg" alt="">

  </div>
  <div class="cell">
    <img src="photos/dvd2.JPG" alt="">
    <div class="cap"><b>Portrait</b><span>2026</span></div>
  </div>
  <div class="cell">
    <img src="photos/gheto2.jpg" alt="">
    <div class="cap"><b>Street</b><span>2026</span></div>
  </div>
</div>

<footer>
  <div>Full site: <a href="index.html">kvnhjpg.com</a></div>
  <div>Portfolio last updated 2026</div>
</footer>

</body>
</html>
